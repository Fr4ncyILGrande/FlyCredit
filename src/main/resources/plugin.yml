name: FlyCredit
version: 1.0.0
author: Fr4ncyILGrande
main: it.flycredit.FlyCreditPlugin
api-version: '26.3'
description: Timed flight in GriefDefender claims, with optional guest access by personal trust level.
depend: [GriefDefender, LuckPerms, PlayTimeManager]
commands:
  flycredit:
    description: Manage flight sessions, balances, and credit transfers
    aliases: [fc]
  flycreditinfo:
    description: Show your available flight credit
  flycreditadd:
    description: Add flight credit to a player’s balance (admin)
permissions:
  flycredit.use:
    description: Use flight credit to fly
    default: true
  flycredit.pay:
    description: Give flight credit to an eligible player
    default: true
  flycredit.admin:
    description: Grant flight credit, view other players’ balances, and run diagnostics. Claim and group restrictions still apply.
    default: op
