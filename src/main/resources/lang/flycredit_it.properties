# Italian player chat and flight bar. Command names and arguments use the same syntax in every language.
help.owner=Proprietario del plugin: %1$s
help.flight=/flycredit <minutes> — inizia a volare | /flycredit off — termina il volo e recupera il tempo rimasto
help.duration=Puoi indicare anche i secondi. Scrivi 1,54 oppure 1.54 per un minuto e 54 secondi.
help.credit=/flycredit info — controlla il saldo | /flycredit give <player> <minutes> — regala minuti di volo
help.admin=Comandi di amministrazione: /flycredit add|set <name|UUID> <minutes> | /flycredit info <name|UUID> | /flycredit diagnostics
command.unknown=Questo comando non esiste. Con /flycredit help trovi quelli disponibili.
command.playerOnly=Questo comando si usa in gioco.
command.permission=Per farlo ti serve il permesso %1$s.
command.cooldown=Aspetta un attimo prima di usare un altro comando.
usage.infoAlias=Usa /flycreditinfo [name|UUID]
usage.changeAlias=Usa /%1$s <name|UUID> <minutes>
usage.reserve=Usa /flycredit <minutes>
usage.info=Usa /flycredit info [name|UUID]
usage.off=Usa /flycredit off
usage.give=Usa /flycredit give <player> <minutes>
usage.change=Usa /flycredit %1$s <name|UUID> <minutes>
usage.diagnostics=Usa /flycredit diagnostics

account.unknown=Giocatore sconosciuto. Prova con il suo UUID oppure aspetta che entri nel server.
account.ambiguous=Questo nome corrisponde a più giocatori. Indica l’UUID di quello che cerchi.
account.balance=%1$s | Credito disponibile: %2$s | Riservato per il volo: %3$s
account.history=Tempo di volo usato: %1$s | Regalato: %2$s | Ricevuto: %3$s
account.playtimeLive=Tempo di gioco su PlayTimeManager: %1$s.
account.playtimeSaved=Tempo di gioco su PlayTimeManager: %1$s (ultimo aggiornamento: %2$s).
account.playtimeUnknown=Il tempo di gioco su PlayTimeManager non è ancora disponibile.
account.balanceChanged=%1$s ha ora a disposizione %2$s di volo.
account.yourBalance=Ora hai a disposizione %1$s di volo.
amount.format=Indica i minuti interi oppure aggiungi i secondi con due cifre, da 00 a 59. Per un minuto e 5 secondi, scrivi 1,05.
amount.range=Il numero di minuti che hai indicato è fuori dai limiti consentiti.
amount.invalid=La quantità di credito indicata non è valida.
amount.balanceLimit=Con questa operazione il saldo supererebbe il limite consentito.

duration.minute=un minuto
duration.minutes=%1$s minuti
duration.second=un secondo
duration.seconds=%1$s secondi
duration.both=%1$s e %2$s

transfer.disabled=Su questo server i trasferimenti di credito di volo sono disattivati.
transfer.offline=Scegli un giocatore che sia online e che tu possa vedere.
transfer.self=Non puoi regalare credito di volo a te stesso.
transfer.group=Puoi regalare minuti di volo a chi appartiene a uno di questi gruppi: %1$s.
transfer.pending=Il tuo trasferimento precedente è ancora in corso.
transfer.insufficient=Il credito disponibile non basta. Se hai una sessione di volo aperta, terminala per recuperare il tempo che ti resta.
transfer.sent=Hai regalato %2$s di volo a %1$s.
transfer.received=%1$s ti ha regalato %2$s di volo.

flight.busy=Hai già una sessione di volo attiva o in fase di avvio.
flight.finishFirst=Per scegliere una nuova durata, termina prima il volo in corso con /flycredit off.
flight.claimRequired=Puoi volare in Sopravvivenza o Avventura, nei tuoi claim e in quelli dove hai ricevuto trust o permissiontrust.
flight.alreadyFlying=Puoi già volare grazie a un altro plugin o alla modalità di gioco. Disattiva prima quel volo.
flight.startCancelled=Il volo non è partito perché hai cambiato posizione o modalità di gioco. Il credito prenotato è tornato nel tuo saldo.
flight.started=Volo attivo. Hai a disposizione %1$s. Per terminare prima e recuperare il tempo rimasto, usa /flycredit off.
flight.stopped=Hai terminato il volo. Il tempo che non hai usato è tornato nel tuo saldo.
flight.accessLost=Il volo si è interrotto per un cambio di modalità, di permessi o di accesso al claim.
flight.exhausted=Hai esaurito il tempo di volo di questa sessione.
flight.leftClaim=Hai lasciato l’area in cui potevi volare. Il volo è terminato e hai recuperato il tempo rimasto.
flight.insufficient=Non hai abbastanza credito di volo per avviare questa sessione.
flight.startPending=Il volo si sta già attivando. Riprova tra un attimo.
bar.active=FlyCredit | %1$s
bar.paused=FlyCredit | %1$s | In pausa

diagnostics.server=%1$s | Java %2$s
diagnostics.missing=%1$s: non installato
diagnostics.enabled=%1$s %2$s: attivo
diagnostics.disabled=%1$s %2$s: disattivato
diagnostics.transfersOff=I trasferimenti sono disattivati. Per abilitarli, imposta transfer.allowed-recipient-groups.
diagnostics.groups=Gruppi abilitati a ricevere: %1$s | Appartenenza richiesta: %2$s
diagnostics.canReceive=Puoi ricevere credito di volo.
diagnostics.cannotReceive=Al momento non puoi ricevere credito di volo.
error.busy=Il database è occupato. Riprova tra un attimo.
error.unexpected=FlyCredit ha interrotto il volo per proteggere i saldi. I dettagli sono nella console del server.
