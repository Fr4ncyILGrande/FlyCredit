name: Build FlyCredit

"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate the FlyCredit sources
        id: project
        shell: bash
        run: |
          shopt -s nullglob
          packages=(FlyCredit-GitHub-*.zip)
          directory=.
          case ${#packages[@]} in
            0) echo "Compilo i sorgenti nella radice del repository." ;;
            1)
              directory=$(mktemp -d flycredit-src.XXXXXXXX)
              unzip -q "${packages[0]}" -d "$directory"
              echo "Compilo i sorgenti di ${packages[0]}."
              ;;
            *)
              echo "::error::Carica una sola edizione di FlyCredit per repository."
              exit 1
              ;;
          esac
          if [[ ! -f "$directory/pom.xml" || ! -f "$directory/src/main/resources/plugin.yml" ]]; then
            echo "::error::Nella radice del repository serve uno ZIP FlyCredit-GitHub-*.zip oppure il progetto estratto con pom.xml e src/."
            exit 1
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ steps.project.outputs.directory }}/pom.xml

      - name: Build and test
        shell: bash
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          if [[ -f mvnw && -f .mvn/wrapper/maven-wrapper.properties ]]; then
            sh ./mvnw --batch-mode --no-transfer-progress clean verify
          else
            mvn --batch-mode --no-transfer-progress clean verify
          fi

      - name: Upload the plugin JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.project.outputs.directory }}/target/FlyCredit-*.jar
          archive: false
          if-no-files-found: error
